# Routes Django paths to backend, everything else to the Next.js frontend.
# Template: the nginx entrypoint fills ${NGINX_*} and writes /etc/nginx/nginx.conf.
worker_processes auto;
error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log  /dev/stdout;

    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;
    keepalive_timeout    65;
    client_max_body_size 100M;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The engine's DNS (Docker or Podman), read from /etc/resolv.conf at startup.
    # Re-resolve so recreated containers (new IPs) are found.
    resolver ${NGINX_LOCAL_RESOLVERS} ipv6=off valid=5s;

    server {
        listen 80;

        location = /favicon.ico {
            access_log off;
            log_not_found off;
        }

        # Collected by the backend container into the shared volume.
        location /static/ {
            alias /srv/staticfiles/;
            access_log off;
            expires 1h;
        }

        location ~ ^/(admin|accounts|api|user|ping|docs|workflow|cryo_grids|processes|projects|people/v1|depositions/v1|copick|tem/v1|get_grids_by_user|annotations)(/|$) {
            # Variable forces per-request resolution instead of caching at startup.
            set $upstream_backend backend;
            proxy_pass http://$upstream_backend:8000;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host              $http_host;
            proxy_redirect off;
        }

        location / {
            set $upstream_frontend frontend;
            proxy_pass http://$upstream_frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        'upgrade';
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
