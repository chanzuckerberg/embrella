<!DOCTYPE html>
<html lang="en">
<head>
    <title>Screening</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container-fluid {
            margin-top: 20px;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .table-wrapper {
            overflow-x: auto;
            width: 100%;
        }
        .table th, .table td {
            vertical-align: middle;
            white-space: nowrap;
            text-align: center; /* Center align text */
        }
        .btn-custom {
            background-color: #007bff;
            color: white;
        }
        .btn-custom:hover {
            background-color: #0056b3;
        }
        .go-back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        .go-back-btn:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

<button class="go-back-btn" onclick="window.location.href='/umbrella/'">Go Back</button>

<div class="container-fluid">
    <h2 class="text-center text-primary"><u>Screening</u></h2><br>
    <div class="form-group">
        <label for="screenSelect">Select a Screen:</label>
        <select class="form-control" id="screenSelect">
            <option value="">Select a screen</option>
        </select>
    </div>
    <div class="table-wrapper">
        <table class="table table-hover table-bordered">
            <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Screening</th>
                    <th>Cassette</th>
                    <th>Session Plan</th>
                    <th>Order in Screen</th>
                    <th>Grid Name</th>
{#                    <th>Grid ID</th>#}
                    <th>Quality</th>
                </tr>
            </thead>
            <tbody id="screenInfoTable">
                <!-- Data will be populated here by JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<script>
$(document).ready(function() {
    // Fetch the unique screen names
    $.ajax({
        url: '/tem/scrn_filter/',  // Update with the correct endpoint
        method: 'GET',
        success: function(response) {
            if (response.unique_names) {
                var screenSelect = $('#screenSelect');
                response.unique_names.forEach(function(name) {
                    screenSelect.append(new Option(name, name));
                });
            } else {
                alert(response.error);
            }
        },
        error: function(error) {
            alert('Error fetching screen names. Please check the console for more details.');
            console.error('Error fetching screen names:', error);
        }
    });

    // Handle the selection change
    $('#screenSelect').change(function() {
        var selectedScreen = $(this).val();
        if (selectedScreen) {
            $.ajax({
                url: `/tem/specific_scrn`,  // Update with the correct endpoint
                method: 'GET',
                data: { session_name: selectedScreen },
                success: function(response) {
                    if (response.sessions) {
                        var screenInfoTable = $('#screenInfoTable');
                        screenInfoTable.empty();
                        response.sessions.forEach(function(session) {
                            screenInfoTable.append(`
                                <tr>
                                    <td>${session.id}</td>
                                    <td>${session.name}</td>
                                    <td><a href="/admin/tem/atlassession/${session.atlas_id}/change/">${session.screening}</a></td>
                                    <td>${session.cassette}</td>
                                    <td><a href="/admin/tem/sessionplan/${session.session_plan_id}/change/">${session.session_plan}</a></td>
                                    <td>${session.order_in_screen}</td>
                                    <td><a href="/admin/cryo_grids/cryogrid/${session.grid_id}/change/">${session.grid_name}</a></td>
{#                                    <td>${session.grid_id}</td>#}
                                    <td>${session.quality}</td>
                                </tr>
                            `);
                        });
                    } else if (response.error) {
                        alert(response.error);
                    }
                },
                error: function(error) {
                    alert('Error fetching specific session data. Please check the console for more details.');
                    console.error('Error fetching specific session data:', error);
                }
            });
        } else {
            $('#screenInfoTable').empty();
        }
    });
});
</script>

</body>
</html>
