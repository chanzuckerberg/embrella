###### Generated using `argus bootstrap` ######
stack:
  # Non-sensitive shared env at the global level. NOTE: global env only merges
  # with service-level env within the same file — do not also define
  # stack.global.env in common.yaml or a service-level env here will silently
  # replace it.
  #
  # Secrets (DJANGO_SECRET_KEY, MYSQL_PWD, and later GOOGLE_SSO_CLIENT_ID/SECRET)
  # are NOT listed here. Set them with
  # `argus set secret --app embrella --env staging <NAME> <value>`; Argus syncs
  # them from AWS Secrets Manager and injects them as env vars at runtime.

  global:
    env:
      - name: DJANGO_ENV
        value: 'staging'
      - name: USE_MYSQL
        value: 'True'
      - name: MYSQL_HOST
        value: embrella-db
      - name: MYSQL_PORT
        value: '3306'
      - name: MYSQL_NAME
        value: production
      - name: MYSQL_USER
        value: root
      - name: SSH_DISABLED
        value: 'True'
      # Demo auth: only the preloaded user may log in (no SSO self-signup)
      - name: EMBRELLA_DISABLE_SIGNUP
        value: 'True'
      - name: FILESERVER_ALLOWED_HOSTS
        value: 'https://$(__ARGUS_STACK_INGRESS_HOST)'
      - name: EMBRELLA_DEMO_BASE_URL
        value: 'https://$(__ARGUS_STACK_INGRESS_HOST)/tomodata/'

  services:
    backend:
      image:
        tag: &backend-image-tag sha-TO-BE-REPLACED-BY-BUILDER-WORKFLOW
      env:
        - name: EMBRELLA_BUILD_STATIC
          value: '1'

    frontend:
      image:
        tag: sha-TO-BE-REPLACED-BY-BUILDER-WORKFLOW
      env:
        - name: BACKEND_URL
          value: 'http://$(__ARGUS_STACK_NAME)-stack-backend:8000'

    worker:
      # Not a built image — reuses the backend image
      image:
        tag: *backend-image-tag
