<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Screening Group</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }
        .container {
            margin-top: 50px;
            max-width: 1000px;
            padding: 50px;
            background-color: #ffffff;
            box-shadow: 0px 0px 25px rgba(0,0,0,0.1);
            border-radius: 12px;
        }
        h2 {
            color: #007bff;
            font-size: 32px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            color: #333;
        }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ced4da;
            font-size: 16px;
        }
        input[type="submit"] {
            width: 50%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            display: block;
            margin: 0 auto;
        }
        input[type="submit"]:hover {
            background-color: #0056b3;
        }
        table {
            margin-bottom: 30px;
        }
        .table-light {
            background-color: #fdfdfe;
        }
        th, td {
            text-align: center;
            vertical-align: middle;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        a {
            color: #007bff;
        }
        a:hover {
            color: #0056b3;
            text-decoration: none;
        }
        .go-back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        .go-back-btn:hover {
            background-color: #5a6268;
        }
        .warning {
            color: red;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>
  <button class="go-back-btn" onclick="window.location.href='/umbrella/'">Go back to the startup page</button>
  <div class="container">
    <h2 class="text-center"><u>Create Screening Group from Grids on a Cassette</u></h2>
    <br>
    <form id="scrnForm" action="{% url 'tem:scrncreate' %}" method="post">
      {% csrf_token %}
      {{ form }}
      <hr>
      <div class="text-center">
        <input type="submit" value="Create a session group and sessions" class="btn btn-custom">
      </div>
      <hr>
      <table class="table table-light table-striped">
        <thead>
          <tr>
            <th>Slot</th>
            <th>Grid</th>
            <th>Grid Freezing</th>
            <th>User</th>
            <th>Project</th>
          </tr>
        </thead>
        <tbody id="grids" name="grids">
          <div class="col-md-12">
            <label for="grids_in_slot">Grids in Cassette</label>
            {{ grids }}
        </tbody>
      </table>
      
    </form>
    <div class="warning" id="warningMessage" style="display: none;">
      Please fill out all required fields.
    </div>
  </div>

  <script>
    $(document).ready(function() {
      $('#id_cassette').change(function() {
          var cassetteId = $(this).val();
          $.ajax({
              url: "{% url 'get_grids_by_cassette' %}",
              data: {
                  'cassette_id': cassetteId
              },
              success: function(data) {
                  var $grid_in_slot = $('#grids');
                  $grid_in_slot.empty();
                  $.each(data, function(index, item) {
                      $grid_in_slot.append(
                        '<tr><td> ' + item.grid_slot_number + ' </td>' +
                        '<td>' + item.grid_name +'</td>' +
                        '<td>' + item.grid_freezing +'</td>' +
                        '<td>' + item.grid_user +'</td>' +
                        '<td>' + item.grid_project_name +'</td></tr>'
                      );
                  });
              }
          });
      });

      $('#scrnForm').submit(function(event) {
        var sessionPlan = $('#id_session_plan').val();
        var cassette = $('#id_cassette').val();
        var order = $('#id_order').val();

        if (!sessionPlan || !cassette || !order) {
          event.preventDefault();
          $('#warningMessage').show();
        } else {
          $('#warningMessage').hide();
        }
      });
    });
  </script>
</body>
</html>
