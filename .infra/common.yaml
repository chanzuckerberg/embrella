###### Generated using `argus bootstrap`, then hand-edited ######
stack:
  global:
    ingress:
      enabled: false
    replicaCount: 1
    autoscaling:
      enabled: false
    service:
      port: 8000
    nodeSelector:
      kubernetes.io/arch: arm64

  services:
    backend:
      image:
        repository: 533267185808.dkr.ecr.us-west-2.amazonaws.com/core-platform/embrella/backend
      resources:
        limits:
          cpu: "2"
          memory: 4Gi
        requests:
          cpu: 500m
          memory: 1Gi
      readinessProbe:
        httpGet:
          path: /ping/
          port: 8000
          httpHeaders:
            - name: Host
              value: localhost
      livenessProbe:
        httpGet:
          path: /ping/
          port: 8000
          httpHeaders:
            - name: Host
              value: localhost
        timeoutSeconds: 5
        periodSeconds: 15
        failureThreshold: 5
      gateway:
        enabled: true
        paths:
          - path: '/(static|admin|accounts|api|user|ping|docs|workflow|cryo_grids|processes|projects|people|depositions|copick|tem|annotations)(/.*)?'
            pathType: RegularExpression

    frontend:
      image:
        repository: 533267185808.dkr.ecr.us-west-2.amazonaws.com/core-platform/embrella/frontend
      service:
        port: 3000
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 250m
          memory: 256Mi
      gateway:
        enabled: true
        paths:
          - path: /
            pathType: Prefix

    # Django-Q background worker. Reuses the backend image.
    # scaled to 0 — trying to deploy without db. unused worker for now
    worker:
      replicaCount: 0
      image:
        repository: 533267185808.dkr.ecr.us-west-2.amazonaws.com/core-platform/embrella/backend
      command: ["python", "umbrella/manage.py", "qcluster"]
      service:
        enabled: false
      resources:
        limits:
          cpu: "1"
          memory: 1Gi
        requests:
          cpu: 500m
          memory: 512Mi
