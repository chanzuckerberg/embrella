<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run Aretomo3 Job</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .form-group {
            margin-bottom: 15px;
            position: relative;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="number"], input[type="password"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 12px 24px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        .form-container {
            max-width: 800px;
            margin: auto;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 40px;
        }
        h1 {
            text-align: center;
        }
        #outputContainer {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
        .cancel-container {
            margin-top: 40px;
            margin-bottom: 40px;
        }
        .cancel-container button {
            background-color: #f44336;
        }
        .cancel-container button:hover {
            background-color: #e53935;
        }
        #trackingContainer {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
        #jobTable {
            width: 100%;
            border-collapse: collapse;
        }
        #jobTable th, #jobTable td {
            border: 1px solid #ddd;
            padding: 12px;
        }
        #jobTable th {
            background-color: #f2f2f2;
            text-align: left;
        }
        .button-container {
            display: flex;
            justify-content: space-between;
            align-items: center
        }
        .button-container button.track-all {
            background-color: #2196F3;
        }
        .button-container button.track-all:hover {
            background-color: #1e88e5;
        }
        .go-back {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .go-back:hover {
            background-color: #1e88e5;
        }
        .error-message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #e74c3c;
            border-radius: 4px;
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <button class="go-back" onclick="goBack()">Go Back</button>
    <div class="form-container">
        <h1>Run Aretomo3 Job</h1>
        <form id="sessionForm">
            <div class="form-group">
                <label for="sessionName">Session Name: (e.g., 24jul01a)</label>
                <input type="text" id="sessionName" name="sessionName" required>
            </div>
            <div class="form-group">
                <label for="runNumber">Run Number: (e.g., 001)</label>
                <input type="number" id="runNumber" name="runNumber" required>
            </div>
            <div class="form-group">
                <label for="pixelSize">Pixel Size:</label>
                <input type="number" step="any" id="pixelSize" name="pixelSize" required>
            </div>
            <div class="form-group">
                <label for="runNumber">Calibrated total dose:</label>
                <input type="number" id="dosenumber" name="dosenumber" required>
            </div>
            <div class="form-group">
                <label for="numChecks">Estimated number of tilt series: (e.g. 300; Please be generous!)</label>
                <input type="number" id="numChecks" name="numChecks" required>
            </div>
            <div class="form-group">
                <label for="userId">User ID: (e.g., firstname.lastname)</label>
                <input type="text" id="userId" name="userId">
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="button" onclick="runFunction()">Run</button>
            <div id="errorMessage" class="error-message"></div>
        </form>
        <div id="outputContainer">
            <strong>Output Directory:</strong> <span id="outputDirectory"></span>
        </div>
    </div>

    <div class="form-container cancel-container">
        <h1>JobCanceler</h1>
        <form id="cancelForm">
            <div class="form-group">
                <label for="cancelUserId">User ID: (e.g., firstname.lastname)</label>
                <input type="text" id="cancelUserId" name="userId">
            </div>
            <div class="form-group">
                <label for="cancelPassword">Password:</label>
                <input type="password" id="cancelPassword" name="password" required>
            </div>
            <div class="form-group">
                <label for="jobNumber">Job Number:</label>
                <input type="number" id="jobNumber" name="jobNumber" required>
            </div>
            <button type="button" onclick="confirmCancel()">Cancel</button>
        </form>
    </div>

    <div class="form-container">
        <h1>JobTracker</h1>
        <form id="trackForm">
            <div class="form-group">
                <label for="jobName">Job Name:</label>
                <input type="text" id="jobName" name="jobName">
            </div>
            <div class="button-container">
                <button type="button" onclick="trackJobs()">Track Jobs</button>
                <button type="button" class="track-all" onclick="trackAllJobs()">Track All Jobs</button>
            </div>
        </form>
        <div id="trackingContainer">
            <table id="jobTable">
                <thead>
                    <tr>
                        <th>JOBID</th>
                        <th>PARTITION</th>
                        <th>NAME</th>
                        <th>USER</th>
                        <th>ST</th>
                        <th>TIME</th>
                        <th>NODES</th>
                        <th>NODELIST(REASON)</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        async function fetchUserInfo() {
            try {
                const response = await fetch('/workflow/user_info');
                const result = await response.json();

                if (response.ok && result.username) {
                    document.getElementById('userId').value = result.username;
                } else {
                    alert('Failed to fetch user info');
                }
            } catch (error) {
                alert('An error occurred while fetching user info');
            }
        }

        async function runFunction() {
            const sessionName = document.getElementById('sessionName').value;
            const runNumber = document.getElementById('runNumber').value;
            const pixelSize = document.getElementById('pixelSize').value;
            const dosenumber = document.getElementById('dosenumber').value;
            const numChecks = document.getElementById('numChecks').value;
            const userId = document.getElementById('userId').value;
            const password = document.getElementById('password').value;

            // Encode the password using Base64
            const encodedPassword = btoa(password);

            const csrftoken = getCookie('csrftoken');

            const response = await fetch('/workflow/run_aretomo3', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                body: JSON.stringify({
                    session_name: sessionName,
                    run_number: runNumber,
                    pixel_size: pixelSize,
                    dose_number: dosenumber,
                    num_checks: numChecks,
                    user_id: userId,
                    password: encodedPassword,
                })
            });

            const result = await response.json();

            if (response.ok) {
                alert(`Message: ${result.message}`);
                document.getElementById('outputDirectory').textContent = `/hpc/projects/group.czii/krios1.processing/aretomo3/${sessionName}/run${runNumber}`;
                document.getElementById('outputContainer').style.display = 'block';
                document.getElementById('errorMessage').style.display = 'none';
            } else {
                document.getElementById('errorMessage').textContent = `Error: ${result.error || 'Failed to run the job.'}`;
                document.getElementById('errorMessage').style.display = 'block';
            }
        }

        function confirmCancel() {
            const ignorePrompt = getCookie('ignoreCancelPrompt');
            if (ignorePrompt === 'true') {
                cancelFunction();
            } else {
                const confirmCancel = confirm("Are you sure you want to cancel?");
                if (confirmCancel) {
                    const ignoreFuturePrompts = confirm("Do you want to ignore this prompt for the next 24 hours?");
                    if (ignoreFuturePrompts) {
                        setCookie('ignoreCancelPrompt', 'true', 1);
                    }
                    cancelFunction();
                }
            }
        }

        function setCookie(name, value, days) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + date.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        async function cancelFunction() {
            const jobNumber = document.getElementById('jobNumber').value;
            const userId = document.getElementById('cancelUserId').value;
            const password = document.getElementById('cancelPassword').value;

            // Encode the password using Base64 if provided
            const encodedPassword = password ? btoa(password) : null;
            const csrftoken = getCookie('csrftoken');

            // Construct the request body dynamically
            const requestBody = {
                job_number: jobNumber,
                user_id: userId,  // Ensure user_id is always included
                password: encodedPassword  // Ensure password is always included
            };

            const response = await fetch('/workflow/cancel_aretomo3', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                body: JSON.stringify(requestBody)  // Send the request body with password
            });

            const result = await response.json();

            if (response.ok) {
                alert(`Job ${jobNumber} has been canceled.`);
            } else {
                alert(`Failed to cancel the job. Error: ${result.error}`);
            }
        }

        async function trackJobs() {
            const jobName = document.getElementById('jobName').value;

            const response = await fetch('/workflow/track_jobs', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    job_name: jobName
                })
            });

            const result = await response.json();

            if (response.ok) {
                const tbody = document.querySelector('#jobTable tbody');
                tbody.innerHTML = ''; // Clear existing rows

                result.jobs.forEach(job => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${job.JOBID}</td>
                        <td>${job.PARTITION}</td>
                        <td>${job.NAME}</td>
                        <td>${job.USER}</td>
                        <td>${job.ST}</td>
                        <td>${job.TIME}</td>
                        <td>${job.NODES}</td>
                        <td>${job['NODELIST(REASON)']}</td>
                    `;
                    tbody.appendChild(row);
                });

                document.getElementById('trackingContainer').style.display = 'block';
            } else {
                alert(`Failed to track jobs. Error: ${result.error}`);
            }
        }

        async function trackAllJobs() {
            const response = await fetch('/workflow/track_jobs', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    job_name: null
                })
            });

            const result = await response.json();

            if (response.ok) {
                const tbody = document.querySelector('#jobTable tbody');
                tbody.innerHTML = ''; // Clear existing rows

                result.jobs.forEach(job => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${job.JOBID}</td>
                        <td>${job.PARTITION}</td>
                        <td>${job.NAME}</td>
                        <td>${job.USER}</td>
                        <td>${job.ST}</td>
                        <td>${job.TIME}</td>
                        <td>${job.NODES}</td>
                        <td>${job['NODELIST(REASON)']}</td>
                    `;
                    tbody.appendChild(row);
                });

                document.getElementById('trackingContainer').style.display = 'block';
            } else {
                alert(`Failed to track jobs. Error: ${result.error}`);
            }
        }

        function goBack() {
            window.location.href = '/umbrella';
        }

        document.addEventListener('DOMContentLoaded', (event) => {
            fetchUserInfo();
        });
    </script>
</body>
</html>
