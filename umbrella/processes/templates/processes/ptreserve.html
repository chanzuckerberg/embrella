<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Processing Session with tomogram as input</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
  <style>
    body {
      background-color: #f8f9fa;
      font-family: Arial, sans-serif;
    }
    .container {
      margin-top: 50px;
      max-width: 1000px;
      padding: 50px;
      background-color: #ffffff;
      box-shadow: 0px 0px 25px rgba(0,0,0,0.1);
      border-radius: 12px;
    }
    h2 {
      color: #007bff;
      font-size: 32px;
    }
    form {
      margin-top: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      font-weight: bold;
      color: #333;
    }
    select {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ced4da;
      font-size: 16px;
    }
    input[type="submit"] {
      width: 50%;
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      display: block;
      margin: 0 auto;
    }
    input[type="submit"]:hover {
      background-color: #0056b3;
    }
    .warning {
      color: red;
      font-weight: bold;
      margin-top: 10px;
    }
    .go-back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 20px;
      background-color: #6c757d;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    .go-back-btn:hover {
      background-color: #5a6268;
    }
  </style>
</head>
<body>
  <button class="go-back-btn" onclick="history.back()">Back</button>
  <div class="container">
    <h2 class="text-center"><u>Create Processing Run with tomogram input</u></h2><br>
    <form id="runForm" action="{% url 'processes:ptcreate' %}" method="post">
      {% csrf_token %}
      <div class="row form-group">
        <div class="col-md-12">
        {{ form }}
        </div>
      </div>
      <div class="row form-group">
        <div class="col-md-12">
          <label for="input_tomo">Input Tomogram</label>
          <select id="input_tomo" name="input_tomo" required>
            {% for option in input_tomo_field.choices %}
              <option value="{{ option.0 }}" {% if option.0 == input_tomo_field.input_tomo.value %}selected{% endif %}>
                {{ option.1 }}
              </option>
            {% endfor %}
          </select>
        </div>
      </div>
    <div class="choose_pick" id="show_pick" style="display: none;">
      <div class="row form-group">
        <div class="col-md-12">
          <label for="input_pick">Input Pick</label>
          <select id="input_pick" name="input_pick" >
            {% for option in input_pick_field.choices %}
              <option value="{{ option.0 }}" {% if option.0 == input_pick_field.input_pick.value %}selected{% endif %}>
                {{ option.1 }}
              </option>
            {% endfor %}
          </select>
        </div>
      </div>
    </div>
      <div class="row form-group">
        <div class="col-md-12">
            <input type="submit" value="Create a processing run name">
        </div>
      </div>
    </form>
    <div class="warning" id="warningMessage" style="display: none;">
      Please fill out all required fields.
    </div>
  </div>

  <script>
    $(document).ready(function() {
      $('#id_msi_session').change(function() {
          var sessionId = $(this).val();
          var planId = $('#id_proc_plan').val();
          $.ajax({
              url: "/umbrella/{% url 'get_tomo_by_msi_session' %}",
              data: {
                  'plan_id': planId,
                  'session_id': sessionId
              },
              success: function(data) {
                  var $tomo = $('#input_tomo');
                  var $show_pick = $('#show_pick');
                  var $pick = $('#input_pick');
                  const data1 = data[0];
                  const data2 = data[1];
                  $tomo.empty();
                  $tomo.append('<option value="">Select a tomogram as input</option>');
                  $.each(data1, function(index, item) {
                      $tomo.append('<option value="' + item.id + '">' + item.name + '</option>');
                  });
                  if (data2.length > 0) {
                    $('#show_pick').show();
                    $pick.empty();
                    $pick.append('<option value="">Select a particle pick as input</option>');
                    $.each(data2, function(index, item) {
                      $pick.append('<option value="' + item.id + '">' + item.name + '</option>');
                    });
                  } else {
                    $('#show_pick').hide();
                  }
              }
          });
      });

      $('#runForm').submit(function(event) {
        var procPlan = $('#id_proc_plan').val();
        var session = $('#id_msi_session').val();
        var input_tomo = $('#input_tomo').val();
        var input_pick = $('#input_pick').val();

        if (!procPlan || !session || !input_tomo) {
          event.preventDefault();
          $('#warningMessage').show();
        } else {
          $('#warningMessage').hide();
        }
      });
    });
  </script>
</body>
</html>
