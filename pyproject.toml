[project]
name = "czii-umbrella-django"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "~=3.11.0"
dependencies = [
    "aiohttp>=3.14.3",
    "cryptography>=50.0.0",
    "dask>=2025.10.0",
    "duckdb>=1.1.0",
    "fsspec>=2024.6.0",
    "django==5.2.16",
    "django-cors-headers>=4.9.0",
    "django-extensions==4.1",
    "django-allauth[socialaccount]>=65,<66",
    "django-jazzmin>=3.0",
    "django-q2>=1.8.0",
    "djangorestframework==3.17.2",
    "drf-spectacular>=0.28.0",
    "gunicorn==26.0.0",
    "jinja2>=3.1.6",
    "markdown>=3.9",
    "pandas>=2.3.3",
    "paramiko>=4.0.0",
    "pyarrow>=18.0.0",
    "pydantic==2.7.1",
    "pymysql==1.2.3",
    "pyyaml>=6.0",
    "requests>=2.32.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.2",
    "setuptools==83.0.0",
    "whitenoise==6.12.0",
    "zarr>=3.1.3",
    "zensical==0.0.52",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "pytest>=9.1.0",
    "pytest-django>=4.12.0",
    "ruff==0.15.17",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "mkdocs.yml",
    "frontend/",
    "**/migrations/**",
]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "B",       # bugbear
    "I",       # isort
    "N",       # pep8-naming
    "ASYNC",   # async
    "COM",     # commas
    "C4",      # comprehensions
    "DTZ",     # datetimez
    "ISC",     # implicit-str-concat
    "G",       # logging-format
    "T20",     # print
    "SIM",     # simplify
]
ignore = [
    "G004",   # logging format
    "W291",   # trailing whitespace
    "W293",   # blank line contains whitespace
    "B008",   # Do not perform calls in argument defaults
    "B905",   # `zip()` without an explicit `strict=` parameter
    "N802",   # Function name should be lowercase
    "N805",   # First argument of a method should be named `self`
    "N806",   # Variable in function should be lowercase
    "N815",   # mixed case variables
    "N999",   # Invalid module name
    "E501",   # line too long
    "C408",   # rewrite empty built-ins as literals
    "T201",   # print statements.
    "DTZ007", # Datetime objects without timezones.
    "DTZ005", # More datetimes without timezones.
    "SIM102", # allow nested if
    "SIM108", # don't require ternary
    "SIM112", # env variables can be lowercase
    "F841",   # assigned to variable never used
    "E402",   # module level import not at top
    "E722",   # bare excepts
    "SIM105", # except silence
    "E701",   # multiple on one line
    "C414",   # sorted(list( allowed
    "B904",   # except from
    "C417",   # unnecessary map()
    "SIM118", # key in dict
    "C405",   # unnecessary list literal
    "B006",   # mutable default in argument
    "N801",   # capwords class name
    "DTZ003", # utcnow() calls
    "COM812", # trailing comma missing
]

[tool.ruff.lint.isort]
known-first-party =["common"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
