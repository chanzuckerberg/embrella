# Production overlay. Combine with compose.yaml.
#
# Before first run on a fresh host:
#   podman network create embrella
#   podman secret create slurm_key /path/to/svc_czii_umbrella     # the SLURM SSH key
#
# Then (--env-file so ${VAR} interpolation resolves; deployv2 copies the chosen
# env file to .env.production on the host):
#   podman compose --env-file .env.production -f infra/compose.yaml -f infra/compose.prod.yaml pull
#   podman compose --env-file .env.production -f infra/compose.yaml -f infra/compose.prod.yaml up -d
#
# Or: `just deployv2 prod .env.production <tag>`.
#
# The db's data lives in the base `db_data` named volume (survives `down`, not
# `down -v`). Durability is via on-demand backups — see `just dbbackupv2 prod`.

services:
  migrate:
    env_file:
      - ../.env.production
    environment:
      DJANGO_ENV: production

  backend:
    env_file:
      - ../.env.production
    environment:
      DJANGO_ENV: production
      SLURM_KEYFILE: /run/secrets/slurm_key
    secrets:
      - slurm_key

  worker:
    env_file:
      - ../.env.production
    environment:
      DJANGO_ENV: production
      SLURM_KEYFILE: /run/secrets/slurm_key
    secrets:
      - slurm_key

  frontend:
    environment:
      NODE_ENV: production

  nginx:
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx_production.conf:/etc/nginx/nginx.conf:ro

secrets:
  slurm_key:
    external: true
