name: Backend

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: embrella-backend-test:ci
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/backend.Dockerfile
          target: test
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=backend

      - name: Ruff lint
        run: docker run --rm "$IMAGE" ruff check umbrella/

      - name: Ruff format
        run: docker run --rm "$IMAGE" ruff format --check umbrella/

      # conftest.py forces sqlite, so no database service is needed. The image
      # has no ENTRYPOINT, so this skips the MySQL-wait shim entirely.
      - name: Pytest
        run: |
          docker run --rm \
            -e DJANGO_SECRET_KEY=ci-not-a-real-secret \
            -e USE_MYSQL=False \
            "$IMAGE" pytest -q
