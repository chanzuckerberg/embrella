# Membrane Segmentation Processor Parameter Schema
#
# Runs membrain-seg inference on Copick tomograms to generate membrane segmentations.
# This processor requires an existing Copick project with imported tomograms.
#
# Custom extensions:
#   x-compute-resource: Groups parameter in "Compute Resources" section - boolean
#   x-slurm-directive: SLURM directive flag (e.g., "--partition") - string
#   x-dynamic-options: Indicates options are loaded dynamically from API - boolean or object
#   x-bash-skip: Skip automatic bash variable generation for this field - boolean

type: object

properties:
  # ============================================================================
  # Copick Project Selection (cascading dropdowns)
  # ============================================================================
  copick_session:
    type: string
    title: Copick Session
    description: Select the Copick session containing tomograms to segment
    minLength: 1
    x-dynamic-options: true
    x-bash-skip: true

  copick_procrun:
    type: string
    title: Copick Run
    description: Select the Copick processing run
    minLength: 1
    x-dynamic-options:
      depends_on: copick_session
    x-bash-skip: true

  tomo_type:
    type: string
    title: Tomogram Type
    description: Tomogram algorithm type (e.g., dctf, wbp, denoise)
    minLength: 1
    x-dynamic-options:
      depends_on:
        - copick_session
        - copick_procrun
    x-bash-skip: true

  tomo_voxel_size:
    type: number
    title: Tomogram Voxel Size (Å)
    description: Voxel size of the tomograms to process
    minimum: 1.0
    maximum: 100.0
    x-dynamic-options:
      depends_on:
        - copick_session
        - copick_procrun
        - tomo_type
    x-bash-skip: true

  # ============================================================================
  # Segmentation Parameters
  # ============================================================================
  threshold:
    type: number
    title: Segmentation Threshold
    description: Optional threshold value for membrane segmentation (leave empty for default)
    x-bash-skip: true

  # ============================================================================
  # SLURM Resource Options (Compute Resources section)
  # ============================================================================
  slurm_partition:
    type: string
    title: "Partition"
    description: SLURM partition to submit job to
    enum:
      - gpu
    default: gpu
    x-slurm-directive: "--partition"
    x-compute-resource: true

  slurm_gpus:
    type: integer
    title: "Number of GPUs"
    description: GPUs to allocate for membrane segmentation
    minimum: 1
    maximum: 8
    default: 4
    x-slurm-directive: "--gpus"
    x-compute-resource: true

  slurm_nodes:
    type: integer
    title: "Number of Nodes"
    description: Number of nodes to allocate
    minimum: 1
    maximum: 10
    default: 1
    x-slurm-directive: "-N"
    x-compute-resource: true

  slurm_cpus_per_task:
    type: integer
    title: "CPUs per Task"
    description: Number of CPU cores per task
    minimum: 1
    maximum: 64
    default: 4
    x-slurm-directive: "--cpus-per-task"
    x-compute-resource: true

  slurm_mem_per_cpu:
    type: string
    title: "Memory per CPU"
    description: Memory per CPU (e.g., 32G)
    default: "32G"
    pattern: "^([0-9]+[KMGT]){0,1}$"
    x-slurm-directive: "--mem-per-cpu"
    x-compute-resource: true

  slurm_time:
    type: string
    title: "Time Limit"
    description: Maximum job runtime (HH:MM:SS format)
    default: "72:00:00"
    pattern: "^[0-9]{1,3}:[0-5][0-9]:[0-5][0-9]$"
    x-slurm-directive: "--time"
    x-compute-resource: true

# Note: Required fields are enforced via minLength/minimum constraints
# and conditional validation in processor.py's validate_parameters() method
