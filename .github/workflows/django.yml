name: Django CI/CD for yb-grid-api

on:
  push:
    branches: ["yb-grid-api"]
  pull_request:
    branches: ["yb-grid-api"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.11]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  deploy:
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add VM to known_hosts
        run: |
          ssh-keyscan 10.50.120.84 >> ~/.ssh/known_hosts

      - name: Deploy to VM
        run: |
          ssh yongbaek.cho@10.50.120.84 "cd /home/yongbaek.cho/czii-umbrella-django/umbrella && ./deploy.sh"