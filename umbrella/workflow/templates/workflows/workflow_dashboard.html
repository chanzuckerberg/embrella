<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Dashboard</title>
  <!-- Bootstrap for basic styling -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <!-- Include Chart.js library -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="container">
  <h1 class="mb-4">Job Dashboard</h1>
    <!-- Session Status Section -->
    <h2>Session Status</h2>
    <form id="sessionForm" class="mb-4">
      <div class="form-group">
        <label for="sessionName">Session Name:</label>
        <input type="text" id="sessionName" class="form-control" placeholder="Enter session name">
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
    <div id="statusResult"></div>

    <!-- Horizontal line between sections -->
    <hr class="my-5" style="border-top: 3px solid #000;">
    
    <!-- Chart 1: Grouped by Job Name -->
    <h2>Grouped by Job Name</h2>
    <canvas id="jobChart" width="800" height="400"></canvas>

    <!-- Chart 2: Grouped by User (Stacked Bar Chart) -->
    <h2 class="mt-5">Grouped by User</h2>
    <canvas id="userChart" width="800" height="400"></canvas>
</div>

<script>
  /*****************************************************
   * 1) Helper function to fetch grouped job data.
   *    Accepts a group_by parameter ("job" or "user")
   *****************************************************/
  async function fetchGroupedJobData(group_by) {
    const baseUrl = "/workflow/data/";
    const fullUrl = `${baseUrl}?group_by=${group_by}`;

    try {
      const response = await fetch(fullUrl, {
        method: "GET",
        headers: { "Content-Type": "application/json" }
      });

      if (!response.ok) {
        console.error(`Request failed with status ${response.status}`);
        return {};
      }

      const data = await response.json();
      console.log(`Fetched data for group_by="${group_by}":`, data);
      return data;
    } catch (error) {
      console.error('Error fetching data:', error);
      return {};
    }
  }

  /*************************************************************
   * 2) Create Chart for "Grouped by Job Name"
   *************************************************************/
  const jobCtx = document.getElementById('jobChart').getContext('2d');
  let jobChart = new Chart(jobCtx, {
    type: 'bar',
    data: {
      labels: [],
      datasets: [{
        label: 'Job Count (by Job Name)',
        data: [],
        backgroundColor: 'rgba(75, 192, 192, 0.6)',
        borderColor: 'rgba(75, 192, 192, 1)',
        borderWidth: 1,
        borderRadius: 5,
        barPercentage: 0.5,
        categoryPercentage: 0.5,
      }]
    },
    options: {
      responsive: true,
      scales: {
        x: { title: { display: true, text: 'Job Name' } },
        y: {
          beginAtZero: true,
          title: { display: true, text: 'Job Count' },
          ticks: { stepSize: 1 }
        }
      },
      plugins: {
        legend: { position: 'top' },
        tooltip: { mode: 'index', intersect: false }
      },
      animation: {
        duration: 1500,
        easing: 'easeOutBounce'
      }
    }
  });

  /*************************************************************
   * 3) Create Chart for "Grouped by User" as a stacked bar chart.
   *************************************************************/
  const userCtx = document.getElementById('userChart').getContext('2d');
  let userChart = new Chart(userCtx, {
    type: 'bar',
    data: { labels: [], datasets: [] },
    options: {
      responsive: true,
      scales: {
        x: {
          stacked: true,
          title: { display: true, text: 'User' }
        },
        y: {
          stacked: true,
          beginAtZero: true,
          title: { display: true, text: 'Job Count' },
          ticks: { stepSize: 1 }
        }
      },
      plugins: {
        legend: { position: 'top' },
        tooltip: { mode: 'index', intersect: false }
      },
      animation: {
        duration: 1500,
        easing: 'easeOutBounce'
      }
    }
  });

  /*************************************************************
   * 4) Update function to fetch data & refresh both charts.
   *************************************************************/
  async function updateCharts() {
    const jobData = await fetchGroupedJobData("job");
    jobChart.data.labels = Object.keys(jobData);
    jobChart.data.datasets[0].data = Object.values(jobData);
    jobChart.update();

    const userData = await fetchGroupedJobData("user");
    const users = Object.keys(userData);
    const jobNameSet = new Set();
    users.forEach(user => {
      const jobCounts = userData[user] || {};
      Object.keys(jobCounts).forEach(jobName => jobNameSet.add(jobName));
    });
    const jobNames = Array.from(jobNameSet);

    const backgroundColors = [
      'rgba(255, 99, 132, 0.6)',
      'rgba(54, 162, 235, 0.6)',
      'rgba(255, 206, 86, 0.6)',
      'rgba(75, 192, 192, 0.6)',
      'rgba(153, 102, 255, 0.6)',
      'rgba(255, 159, 64, 0.6)'
    ];
    const borderColors = [
      'rgba(255, 99, 132, 1)',
      'rgba(54, 162, 235, 1)',
      'rgba(255, 206, 86, 1)',
      'rgba(75, 192, 192, 1)',
      'rgba(153, 102, 255, 1)',
      'rgba(255, 159, 64, 1)'
    ];

    const datasets = jobNames.map((jobName, index) => {
      const data = users.map(user => userData[user][jobName] || 0);
      return {
        label: jobName,
        data: data,
        backgroundColor: backgroundColors[index % backgroundColors.length],
        borderColor: borderColors[index % borderColors.length],
        borderWidth: 1
      };
    });

    userChart.data.labels = users;
    userChart.data.datasets = datasets;
    userChart.update();
  }

  /*************************************************************
   * 5) Session Status: Fetch and display session status.
   *************************************************************/
  async function fetchSessionStatus(sessionName) {
    const url = `/workflow/status/?session_name=${encodeURIComponent(sessionName)}`;
    try {
      const response = await fetch(url, {
        method: "GET",
        headers: { "Content-Type": "application/json" }
      });
      if (!response.ok) {
        throw new Error(`Request failed with status ${response.status}`);
      }
      const data = await response.json();
      return data;
    } catch (error) {
      console.error('Error fetching session status:', error);
      return null;
    }
  }

  function displayStatusTable(data) {
    // Mapping of raw status keys to user-friendly names
    const statusNameMap = {
      "raw_data_files": "Number of raw data files (.mdoc)",
      "alignment_files": "Number of alignment files (.aln)",
      "sart_volumes_aretomo": "Status of the reformatting job",
      "denoise_volumes": "Status of denoising"
    };

    const result = data.result;
    let tableHTML = `<table class="table table-bordered">
      <thead>
        <tr>
          <th>Status</th>
          <th>Run Number</th>
          <th>Count</th>
        </tr>
      </thead>
      <tbody>`;
    
    Object.entries(result).forEach(([status, value]) => {
      // Get the display name from the map; fallback to the raw key if not defined.
      const displayName = statusNameMap[status] || status;
      
      if (typeof value === "number") {
        tableHTML += `<tr>
          <td>${displayName}</td>
          <td>-</td>
          <td>${value}</td>
        </tr>`;
      } else if (typeof value === "object" && value !== null) {
        let firstRow = true;
        Object.entries(value).forEach(([run, count]) => {
          tableHTML += `<tr>
            ${firstRow ? `<td rowspan="${Object.keys(value).length}">${displayName}</td>` : ""}
            <td>${run}</td>
            <td>${count}</td>
          </tr>`;
          firstRow = false;
        });
      }
    });

    tableHTML += `</tbody></table>`;
    document.getElementById('statusResult').innerHTML = tableHTML;
  }

  // Listen to session form submission
  document.getElementById('sessionForm').addEventListener('submit', async function(event) {
    event.preventDefault();
    const sessionName = document.getElementById('sessionName').value.trim();
    if (!sessionName) {
      alert("Please enter a session name.");
      return;
    }
    const data = await fetchSessionStatus(sessionName);
    if (data) {
      displayStatusTable(data);
    } else {
      document.getElementById('statusResult').innerHTML = '<div class="alert alert-danger">Error fetching session status.</div>';
    }
  });

  /*************************************************************
   * 6) On page load, fetch data once and then refresh periodically.
   *************************************************************/
  updateCharts();
  setInterval(updateCharts, 50000);
</script>
</body>
</html>
