user  nginx;
worker_processes auto;
error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /dev/stdout main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;
    client_max_body_size 100M;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    server {
        listen 80;
        server_name umbrella.czbiohub.org _;

        location = /favicon.ico {
            access_log off;
            log_not_found off;
        }

        # Static files: served straight off the shared volume populated by
        # collectstatic in the backend container.
        location /static/ {
            alias /srv/staticfiles/;
            access_log off;
            expires 1h;
        }

        # ===== DJANGO BACKEND ROUTES =====
        location ~ ^/(admin|accounts|api|user|ping|version|docs|legacy|workflow|cryo_grids|processes|projects|people/v1|depositions/v1|copick|tem/v1|get_grids_by_user|get_grids_by_cassette|get_tomo_by_msi_session|available_grids|annotations)(/|$) {
            proxy_pass http://backend:8000;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host             $http_host;
            proxy_redirect off;
        }

        # ===== COPICK-WEB VIEWER (separate app on the embrella network) =====
        location = /viewer/copick-web {
            return 301 /viewer/copick-web/;
        }

        location /viewer/copick-web/ {
            proxy_pass http://copick-web:8880/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        'upgrade';
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ===== NEXT.JS FRONTEND (DEFAULT) =====
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        'upgrade';
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
