<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Processing Run with frames as input</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
  <style>
    body {
      background-color: #f8f9fa;
      font-family: Arial, sans-serif;
    }
    .container {
      margin-top: 50px;
      max-width: 1000px;
      padding: 50px;
      background-color: #ffffff;
      box-shadow: 0px 0px 25px rgba(0,0,0,0.1);
      border-radius: 12px;
    }
    h2 {
      color: #007bff;
      font-size: 32px;
    }
    form {
      margin-top: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      font-weight: bold;
      color: #333;
    }
    select {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ced4da;
      font-size: 16px;
    }
    input[type="submit"], button {
      width: 50%;
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      display: block;
      margin: 0 auto;
    }
    input[type="submit"]:hover, button:hover {
      background-color: #0056b3;
    }
    .warning {
      color: red;
      font-weight: bold;
      margin-top: 10px;
    }
    .go-back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 20px;
      background-color: #6c757d;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    .go-back-btn:hover {
      background-color: #5a6268;
    }
  </style>
</head>
<body>
  <button class="go-back-btn" onclick="window.location.href='/umbrella/'">Go back to the startup page</button>
  <div class="container">
    <h2 class="text-center"><u>Create Processing Run with frame input</u></h2><br>
    <form id="runForm" onsubmit="return false;">
      <div class="row form-group">
        <div class="col-md-12">
        {{ form }}
        </div>
      </div>
      <div class="row form-group">
        <div class="col-md-12">
            <button type="button" id="submitButton">Create a processing run name</button>
        </div>
      </div>
    </form>
    <div class="warning" id="warningMessage" style="display: none;">
      Please fill out all required fields.
    </div>
  </div>

  <script>
    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
          const cookie = cookies[i].trim();
          // Does this cookie string begin with the name we want?
          if (cookie.substring(0, name.length + 1) === (name + '=')) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }
      return cookieValue;
    }

    $(document).ready(function() {
      // Ensure the form doesn't submit normally
      $('#runForm').submit(function(e) {
        e.preventDefault();
        return false;
      });

      $('#submitButton').click(function(e) {
        // Prevent any default behavior
        e.preventDefault();
        
        var procPlan = $('#id_proc_plan').val();
        var session = $('#id_msi_session').val();

        if (!procPlan || !session) {
          $('#warningMessage').show();
          return false;
        }
        
        $('#warningMessage').hide();
        
        // Prepare the data to be sent as JSON
        var formData = {
          'proc_plan': procPlan,
          'msi_session': session
        };
        
        console.log("Sending data:", formData);
        
        // Send data as JSON to the create_run endpoint
        $.ajax({
          url: "{% url 'processes:create' %}",
          type: "POST",
          data: JSON.stringify(formData),
          contentType: "application/json",
          headers: {
            "X-CSRFToken": getCookie("csrftoken")
          },
          success: function(response) {
            console.log("Success response:", response);
            // On successful creation, redirect to the detail page
            if (response.id) {
              window.location.href = `/processes/${response.id}/`;
            } else if (response.redirect_url) {
              window.location.href = response.redirect_url;
            } else {
              console.log("Unexpected success response format");
            }
          },
          error: function(xhr, status, error) {
            console.error("Error:", xhr.responseText);
            // Display error message
            var errorMsg = "Error: ";
            if (xhr.responseJSON && xhr.responseJSON.error) {
              errorMsg += xhr.responseJSON.error;
            } else {
              errorMsg += error;
            }
            $('#warningMessage').text(errorMsg);
            $('#warningMessage').show();
          }
        });
        
        return false;
      });
    });
  </script>
</body>
</html>
