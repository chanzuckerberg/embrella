<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Job Canceler</title>
  <style>
    /* Basic styling for the cancel page */
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f5f5f5;
    }
    .form-container {
      max-width: 600px;
      margin: auto;
      padding: 30px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      background-color: white;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="text"],
    input[type="password"],
    input[type="number"] {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    /* Cancel button styling */
    .cancel-container button {
      background-color: #f44336;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .cancel-container button:hover {
      background-color: #e53935;
    }
  </style>
</head>
<body>
  <div class="form-container cancel-container">
    <h1>Job Canceler</h1>
    <p>
      <strong style="color:red;">Note:</strong>
      If you encounter an Unexpected Token error, please log in again.
    </p>
    <form id="cancelForm">
      <div class="form-group">
        <label for="cancelUserId">User ID: (e.g., firstname.lastname)</label>
        <input type="text" id="cancelUserId" name="userId" required />
      </div>
      <div class="form-group">
        <label for="cancelPassword">Password:</label>
        <input type="password" id="cancelPassword" name="password" required />
      </div>
      <div class="form-group">
        <label for="jobNumber">Job Number:</label>
        <input type="number" id="jobNumber" name="jobNumber" required />
      </div>
      <button type="button" onclick="confirmCancel()">Cancel</button>
    </form>
  </div>

  <script>
    // Helper: Get a cookie's value
    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== "") {
        const cookies = document.cookie.split(";");
        for (let i = 0; i < cookies.length; i++) {
          const cookie = cookies[i].trim();
          if (cookie.substring(0, name.length + 1) === (name + "=")) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }
      return cookieValue;
    }

    // Helper: Get element's trimmed value safely
    function getElementValue(id) {
      const elem = document.getElementById(id);
      if (!elem) {
        console.error(`Element with id '${id}' not found.`);
        alert(`Internal error: Element with id '${id}' not found.`);
        throw new Error(`Element with id '${id}' not found.`);
      }
      return elem.value.trim();
    }

    // Helper: Set a cookie with a specified number of days until expiration
    function setCookie(name, value, days) {
      const date = new Date();
      date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000);
      const expires = "expires=" + date.toUTCString();
      document.cookie = name + "=" + value + ";" + expires + ";path=/";
    }

    // Fetch user info and populate cancelUserId field
    async function fetchUserInfo() {
      try {
        const response = await fetch("/workflow/user_info");
        const result = await response.json();

        if (response.ok && result.username) {
          document.getElementById("cancelUserId").value = result.username;
        } else {
          alert("Failed to fetch user info.");
        }
      } catch (error) {
        alert("An error occurred while fetching user info.");
      }
    }

    // Confirm cancel: prompts user before cancelling
    function confirmCancel() {
      const ignorePrompt = getCookie("ignoreCancelPrompt");
      if (ignorePrompt === "true") {
        cancelFunction();
      } else {
        const userConfirmed = confirm("Are you sure you want to cancel?");
        if (userConfirmed) {
          const ignoreFuturePrompts = confirm("Ignore this prompt for the next 24 hours?");
          if (ignoreFuturePrompts) {
            setCookie("ignoreCancelPrompt", "true", 1);
          }
          cancelFunction();
        }
      }
    }

    // Cancel function: sends the cancel request to the server
    async function cancelFunction() {
      try {
        const jobNumber = getElementValue("jobNumber");
        const userId = getElementValue("cancelUserId");
        const passwordElem = document.getElementById("cancelPassword");
        if (!passwordElem) {
          console.error("Element with id 'cancelPassword' not found.");
          alert("Internal error: Element with id 'cancelPassword' not found.");
          return;
        }
        const password = passwordElem.value;
        if (!password) {
          alert("Password is required.");
          return;
        }
        const encodedPassword = btoa(password);

        const csrftoken = getCookie("csrftoken");
        const requestBody = {
          job_number: jobNumber,
          user_id: userId,
          password: encodedPassword,
        };

        console.log("Submitting Cancel Form with requestBody:", requestBody);

        const response = await fetch("/workflow/cancel_jobs", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrftoken,
          },
          body: JSON.stringify(requestBody),
        });
        const result = await response.json();
        if (response.ok) {
          alert(`Job ${jobNumber} has been canceled.`);
        } else {
          alert(`Failed to cancel the job. Error: ${result.error}`);
        }
      } catch (error) {
        console.error("Error during job cancellation:", error);
        alert(`Failed to cancel the job. Error: ${error.message || "Unknown error."}`);
      }
    }

    // Fetch user info when page loads so the user ID is auto-populated
    window.addEventListener("DOMContentLoaded", fetchUserInfo);
  </script>
</body>
</html>
