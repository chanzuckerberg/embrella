{% extends "admin/change_form.html" %}
{% load i18n admin_urls %}

{% block object-tools-items %}
    {{ block.super }}
    <li style="margin-bottom: 10px;">
        <a href="{% url 'admin:cryo_grid_run_action' original.pk %}" 
           class="btn btn-success"
           style="background-color: #28a745; border-color: #28a745; color: white; 
                  padding: 6px 12px; font-size: 14px; border-radius: 4px; 
                  text-decoration: none; margin-top: 10px;"
           onclick="return showDuplicateModal(this);">
            <i class="fas fa-copy"></i> {% trans 'Duplicate Grid' %}
        </a>
    </li>
{% endblock %}

{% block extrahead %}
    {{ block.super }}
    <style>
        /* Match Jazzmin save button styles */
        .object-tools .btn-success {
            background-color: #28a745;
            border-color: #28a745;
            color: white;
            font-weight: 400;
            line-height: 1.5;
            text-align: center;
            vertical-align: middle;
            width: 100%;
            cursor: pointer;
            user-select: none;
            transition: color .15s ease-in-out,
                        background-color .15s ease-in-out,
                        border-color .15s ease-in-out,
                        box-shadow .15s ease-in-out;
        }

        .object-tools .btn-success:hover {
            background-color: #218838;
            border-color: #1e7e34;
            color: white;
        }

        .object-tools .btn-success:focus {
            box-shadow: 0 0 0 0.2rem rgba(40, 167, 69, 0.5);
        }

        .object-tools .btn-success i {
            margin-right: 4px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-dialog {
            position: relative;
            width: auto;
            margin: 1.75rem auto;
            max-width: 600px;
        }

        .modal-content {
            position: relative;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (!document.getElementById('duplicateGridModal')) {
                const modalHtml = `
                    <div id="duplicateGridModal" class="modal">
                        <div class="modal-dialog">
                            <div id="modalContent"></div>
                        </div>
                    </div>`;
                document.body.insertAdjacentHTML('beforeend', modalHtml);
            }
        });

        function showDuplicateModal(link) {
            const modal = document.getElementById('duplicateGridModal');
            const modalContent = document.getElementById('modalContent');
            
            modal.style.display = 'block';
            modalContent.innerHTML = `
                <div class="modal-content shadow-lg">
                    <div class="modal-body text-center p-5">
                        <i class="fas fa-spinner fa-spin fa-2x text-primary"></i>
                        <p class="mt-3">Loading...</p>
                    </div>
                </div>`;

            fetch(link.href)
                .then(response => response.text())
                .then(html => {
                    modalContent.innerHTML = html;
                    setupModalEvents();
                })
                .catch(error => {
                    console.error('Error:', error);
                    modalContent.innerHTML = `
                        <div class="modal-content shadow-lg">
                            <div class="modal-body text-center p-5">
                                <i class="fas fa-exclamation-circle fa-2x text-danger"></i>
                                <p class="mt-3">Error loading form. Please try again.</p>
                            </div>
                        </div>`;
                });

            return false;
        }

        function setupModalEvents() {
            const modal = document.getElementById('duplicateGridModal');
            
            modal.addEventListener('click', function(event) {
                if (event.target === modal) {
                    closeModal();
                }
            });

            const closeButtons = document.querySelectorAll('.close-modal');
            closeButtons.forEach(button => {
                button.addEventListener('click', closeModal);
            });

            const form = document.getElementById('copyGridForm');
            if (form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    submitForm(form);
                });

                // Setup box change event
                const boxSelect = document.getElementById('id_new_box');
                if (boxSelect) {
                    boxSelect.addEventListener('change', function() {
                        updateAvailablePositions(this.value);
                    });
                    // Trigger initial check
                    if (boxSelect.value) {
                        updateAvailablePositions(boxSelect.value);
                    }
                }
            }
        }

        function updateAvailablePositions(boxId) {
            if (!boxId) {
                updatePositionsDisplay(0);
                return;
            }

            const helpText = document.getElementById('positions-help');
            helpText.innerHTML = '<span class="text-info"><i class="fas fa-spinner fa-spin mr-1"></i>Checking available positions...</span>';

            // Use the correct URL pattern
            const url = `/admin/cryo_grids/cryogrid/${boxId}/available-positions/`;

            fetch(url, {
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                    'Accept': 'application/json',
                }
            })
            .then(response => response.json())
            .then(data => {
                console.log('Received data:', data);  // Debug log
                updatePositionsDisplay(data.max_positions);
            })
            .catch(error => {
                console.error('Error:', error);
                helpText.innerHTML = '<span class="text-danger"><i class="fas fa-exclamation-circle mr-1"></i>Error checking available positions</span>';
            });
        }

        function updatePositionsDisplay(maxPositions) {
            const helpText = document.getElementById('positions-help');
            const submitBtn = document.getElementById('submit-btn');
            
            if (maxPositions > 0) {
                helpText.innerHTML = `
                    <span class="text-success">
                        <i class="fas fa-check-circle mr-1"></i>
                        Available positions in selected box: 
                        <strong class="badge badge-success">${maxPositions}</strong>
                    </span>`;
                submitBtn.disabled = false;
            } else {
                helpText.innerHTML = `
                    <span class="text-danger">
                        <i class="fas fa-times-circle mr-1"></i>
                        No available positions in selected box
                    </span>`;
                submitBtn.disabled = true;
            }
        }

        function closeModal() {
            const modal = document.getElementById('duplicateGridModal');
            modal.style.display = 'none';
        }

        function submitForm(form) {
            fetch(form.action, {
                method: 'POST',
                body: new FormData(form),
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => response.text())
            .then(html => {
                if (html.includes('error_message')) {
                    document.getElementById('modalContent').innerHTML = html;
                    setupModalEvents();
                } else {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const successMessage = doc.querySelector('.messagelist .success');
                    const message = successMessage ? successMessage.textContent : 'Grid(s) duplicated successfully!';
                    
                    document.getElementById('modalContent').innerHTML = `
                        <div class="modal-content shadow-lg">
                            <div class="modal-header bg-success text-white">
                                <h3 class="modal-title">
                                    <i class="fas fa-check-circle mr-2"></i>Success
                                </h3>
                                <button type="button" class="close close-modal text-white" aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                            </div>
                            <div class="modal-body text-center p-5">
                                <i class="fas fa-check-circle fa-3x text-success mb-3"></i>
                                <p class="lead">${message}</p>
                            </div>
                            <div class="modal-footer bg-light">
                                <button type="button" class="btn btn-success" onclick="closeModalAndRefresh()">
                                    <i class="fas fa-check mr-1"></i>Done
                                </button>
                            </div>
                        </div>
                    `;
                    
                    setupModalEvents();
                    
                    setTimeout(() => {
                        window.location.reload();
                    }, 2000);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('modalContent').innerHTML = `
                    <div class="modal-content shadow-lg">
                        <div class="modal-header bg-danger text-white">
                            <h3 class="modal-title">
                                <i class="fas fa-exclamation-circle mr-2"></i>Error
                            </h3>
                            <button type="button" class="close close-modal text-white" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                        <div class="modal-body text-center p-5">
                            <i class="fas fa-exclamation-circle fa-3x text-danger mb-3"></i>
                            <p class="lead">An error occurred while duplicating the grid.</p>
                        </div>
                        <div class="modal-footer bg-light">
                            <button type="button" class="btn btn-secondary close-modal">
                                <i class="fas fa-times mr-1"></i>Close
                            </button>
                        </div>
                    </div>
                `;
                setupModalEvents();
            });
        }

        function closeModalAndRefresh() {
            closeModal();
            window.location.reload();
        }
    </script>
{% endblock %}
