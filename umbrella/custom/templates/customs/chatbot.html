{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chatbot UI</title>
  <link rel="stylesheet" href="{% static 'path/to/your/styles.css' %}">
  <style>
    /* Body and overall page styling */
    body {
      font-family: "Arial", sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    /* Chat container styling (increased width) */
    .chat-container {
      width: 600px; /* Increased from 420px */
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Chat box styling (increased height) */
    .chat-box {
      height: 500px; /* Increased from 360px */
      padding: 15px;
      overflow-y: auto;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
    }

    /* Shared message style */
    .message {
      margin: 6px 0;
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 75%;
      line-height: 1.4;
      font-size: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      position: relative;
      word-wrap: break-word;
      overflow-wrap: break-word;
      white-space: pre-wrap;  /* Adjusts for preserving spaces */
    }

    /* User message specific styling */
    .user-message {
      align-self: flex-end;
      background: #007bff;
      color: #fff;
      border-top-right-radius: 0;
    }

    /* Bot message specific styling */
    .bot-message {
      align-self: flex-start;
      background: #e6e6e6;
      border-top-left-radius: 0;
      display: flex;              /* to place icon and text side by side */
      align-items: flex-start;    /* align icon and text at the top */
    }

    /* Bot icon styling */
    .bot-message .bot-icon {
      width: 32px;
      height: 32px;
      margin-right: 8px;
      object-fit: cover;
      border-radius: 50%;
      align-self: center;
    }

    /* Styling for the text within the bot message */
    .bot-message .message-text {
      flex: 1;
      word-break: break-all;      /* Ensures long, unbroken strings wrap to the next line */
      overflow-wrap: break-word;  /* Extra safety for wrapping long words */
      white-space: normal;        /* Allow text to wrap normally */
    }

    /* Input box and button wrapper */
    .input-box {
      display: flex;
      padding: 10px;
      background: #fff;
      border-top: 1px solid #ddd;
    }

    /* Text input styling */
    input[type="text"] {
      flex: 1;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: border 0.3s;
    }
    input[type="text"]:focus {
      border: 2px solid #764ba2;
    }

    /* Button styling */
    button {
      padding: 12px 20px;
      margin-left: 10px;
      border: none;
      border-radius: 8px;
      background: #764ba2;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }
    button:hover {
      background: #5b3f84;
      transform: translateY(-1px);
    }

    /* Optional scrollbar styling */
    .chat-box::-webkit-scrollbar {
      width: 8px;
    }
    .chat-box::-webkit-scrollbar-thumb {
      background-color: #ccc;
      border-radius: 4px;
    }
    .chat-box::-webkit-scrollbar-thumb:hover {
      background-color: #b3b3b3;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-box" id="chat-box">
      <!-- Messages will be dynamically inserted here -->
    </div>
    <div class="input-box">
      <input type="text" id="user-input" placeholder="Type your message..."/>
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    // Define the bot icon URL using Django's static tag.
    const botIconUrl = "{% static 'customs/bot-icon.png' %}";

    async function sendMessage() {
      const userInput = document.getElementById("user-input").value;
      if (!userInput) return;

      const chatBox = document.getElementById("chat-box");

      // Append user message
      const userMessage = document.createElement("div");
      userMessage.className = "message user-message";
      userMessage.innerText = `You: ${userInput}`;
      chatBox.appendChild(userMessage);
      document.getElementById("user-input").value = "";

      // Scroll to bottom after adding a new message
      chatBox.scrollTop = chatBox.scrollHeight;

      // Fetch bot response
      try {
        const response = await fetch("/agent/confluence/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: userInput })
        });

        // Since the server returns HTML directly, we need to read the text
        const htmlResponse = await response.text();

        // Append bot message with the bot icon and rendered HTML response
        const botMessage = document.createElement("div");
        botMessage.className = "message bot-message";
        botMessage.innerHTML = `
          <img src="${botIconUrl}" alt="Bot Icon" class="bot-icon">
          <div class="message-text">${htmlResponse}</div>
        `;
        chatBox.appendChild(botMessage);
      } catch (error) {
        const errorMessage = document.createElement("div");
        errorMessage.className = "message bot-message";
        errorMessage.innerHTML = `
          <img src="${botIconUrl}" alt="Bot Icon" class="bot-icon">
          <div class="message-text">Error fetching response.</div>
        `;
        chatBox.appendChild(errorMessage);
      }

      // Scroll to bottom after adding bot message
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
