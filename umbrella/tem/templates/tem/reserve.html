{% extends "tem/base.html" %}
{% block title %}Session Creation{% endblock %}
{% block header %}Create TEM Multi-Scaled Imaging Session{% endblock %}
{% block form %}
<form id="sessionForm">
  <div class="row form-group">
    <div class="col-md-12">
      <label for="session_plan">Session Plan</label>
      <select id="session_plan" name="session_plan" required>
        <option value="">Loading...</option>
      </select>
    </div>
  </div>
  <div class="row form-group">
    <div class="col-md-12">
      <label for="project">Project</label>
      <div class="mb-1">
        <select id="project" name="project" required style="width: 100%;">
          <option value="">Loading...</option>
        </select>
      </div>
      <div class="text-right">
        <button type="button" class="btn btn-link text-primary p-0" id="addProjectBtn" title="Create New Project">
          + Create New Project
        </button>
      </div>
    </div>
  </div>
  <div class="row form-group">
    <div class="col-md-6">
      <label for="user">User</label>
      <select id="user" name="user" required>
        <option value="">Loading...</option>
      </select>
    </div>
    <div class="col-md-6">
      <label for="grid">Grid</label>
      <select id="grid" name="grid" required>
        <option value="">Loading...</option>
      </select>
    </div>
  </div>
  <div class="row form-group">
    <div class="col-md-12">
      <label for="magnification">Magnification</label>
      <select id="magnification" name="magnification">
        <option value="">---------</option>
      </select>
    </div>
  </div>
  <div class="row form-group">
    <div class="col-md-12">
      <label for="name">Session Name</label>
      <input type="text" id="name" name="name" class="form-control" placeholder="Loading..." required>
    </div>
  </div>
  <div class="row form-group">
    <div class="col-md-12">
      <input type="submit" value="Create Session" id="submitBtn">
    </div>
  </div>
</form>
{% endblock %}

{% block endscript %}
<!-- Include Select2 CSS and JS files -->
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
  $(document).ready(function () {
    var csrfToken = '{{ csrf_token }}';

    // Load form options (session plans + projects) from v1 API
    $.ajax({
      url: '/tem/v1/sessions/form-options/',
      success: function (data) {
        var $plan = $('#session_plan');
        $plan.empty().append('<option value="">Select a session plan</option>');
        $.each(data.session_plans, function (i, item) {
          $plan.append('<option value="' + item.id + '">' + item.name + '</option>');
        });
        // Set default session plan
        var targetText = "tem tomography collected with tomo5 on krios1 and falcon4i";
        $plan.find('option').each(function () {
          if ($(this).text().trim().toLowerCase() === targetText.toLowerCase()) {
            $plan.val($(this).val()).trigger('change');
            return false;
          }
        });

        var $project = $('#project');
        $project.empty().append('<option value="">Select a project</option>');
        $.each(data.projects, function (i, item) {
          $project.append('<option value="' + item.id + '">' + item.name + '</option>');
        });
      }
    });

    // Load suggested name from v1 API
    $.ajax({
      url: '/tem/v1/sessions/suggest-name/',
      success: function (data) {
        $('#name').val(data.suggested_name).attr('placeholder', '');
      }
    });

    // Load users and pre-select current user
    $.ajax({
      url: '/api/list/all/users/',
      success: function (data) {
        var $user = $('#user');
        $user.empty();
        var users = data.users || data.results || data;
        $.each(users, function (i, item) {
          var label = item.full_name || item.username || (item.first_name + ' ' + item.last_name);
          $user.append('<option value="' + item.id + '">' + label + '</option>');
        });
        // Pre-select the logged-in user
        var currentUserId = '{{ request.user.id }}';
        if (currentUserId) {
          $user.val(currentUserId);
        }
      }
    });

    // Load all grids on page load
    $.ajax({
      url: '/get_grids_by_user/',
      success: function (data) {
        populateGridDropdown(data);
      }
    });

    function populateGridDropdown(data) {
      var $grid = $('#grid');
      $grid.empty();
      var defaultGridId = null;
      $.each(data, function (index, item) {
        if (item.is_default) defaultGridId = item.id;
        var name = item.display_name || item.name;
        $grid.append('<option value="' + item.id + '">' + name + '</option>');
      });
      if (defaultGridId) {
        $grid.val(defaultGridId);
      } else {
        $grid.prepend('<option value="">Select a grid</option>').val('');
      }
      if ($grid.hasClass('select2-hidden-accessible')) $grid.select2('destroy');
      $grid.select2({ placeholder: "Search for a grid...", allowClear: true, width: '100%' });
    }

    // Load magnifications from v1 API when session plan changes
    $('#session_plan').change(function () {
      var planId = $(this).val();
      var $mag = $('#magnification');
      $mag.empty().append('<option value="">---------</option>');
      if (!planId) return;
      $.ajax({
        url: '/tem/v1/magnifications/',
        data: { session_plan_id: planId },
        success: function (data) {
          $.each(data, function (i, item) {
            $mag.append('<option value="' + item.id + '">' + item.scope__name + ' ' + item.nominal_mag + 'x (' + item.mode + ')</option>');
          });
        }
      });
    });

    // Add project popup
    $('#addProjectBtn').click(function () {
      var popup = window.open(window.location.origin + '/admin/projects/project/add/', 'CreateProject', 'width=800,height=600,resizable=yes,scrollbars=yes');
      if (popup) {
        var checker = setInterval(function () {
          if (popup.closed) {
            clearInterval(checker);
            // Reload form options to pick up new project
            $.ajax({
              url: '/tem/v1/sessions/form-options/',
              success: function (data) {
                var $project = $('#project');
                var prev = $project.val();
                $project.empty().append('<option value="">Select a project</option>');
                $.each(data.projects, function (i, item) {
                  $project.append('<option value="' + item.id + '">' + item.name + '</option>');
                });
                if (prev) $project.val(prev);
              }
            });
          }
        }, 500);
      }
    });

    // Submit form via v1 API
    $('#sessionForm').submit(function (event) {
      event.preventDefault();

      var sessionPlanId = $('#session_plan').val();
      var projectId = $('#project').val();
      var gridId = $('#grid').val();
      var name = $('#name').val().trim();
      var magnificationId = $('#magnification').val() || null;

      if (!sessionPlanId || !projectId || !gridId || !name) {
        $('#warningMessage').text('Please fill out all required fields.').show();
        return;
      }

      var payload = {
        name: name,
        session_plan_id: parseInt(sessionPlanId),
        project_id: parseInt(projectId),
        grid_id: parseInt(gridId),
      };
      if (magnificationId) {
        payload.magnification_id = parseInt(magnificationId);
      }

      $('#submitBtn').prop('disabled', true).val('Creating...');
      $('#warningMessage').hide();

      $.ajax({
        url: '/tem/v1/sessions/',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify(payload),
        headers: { 'X-CSRFToken': csrfToken },
        success: function (data) {
          // Redirect to session detail page
          window.location.href = '/legacy/tem/' + data.id + '/';
        },
        error: function (xhr) {
          $('#submitBtn').prop('disabled', false).val('Create Session');
          var errors = xhr.responseJSON;
          if (errors) {
            var messages = [];
            $.each(errors, function (field, msgs) {
              if (Array.isArray(msgs)) {
                messages.push(field + ': ' + msgs.join(', '));
              } else if (typeof msgs === 'string') {
                messages.push(field + ': ' + msgs);
              }
            });
            $('#warningMessage').text(messages.join(' | ')).show();
          } else {
            $('#warningMessage').text('An error occurred. Please try again.').show();
          }
        }
      });
    });
  });
</script>
{% endblock %}
</body>
</html>
