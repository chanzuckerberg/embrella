# Copick Processor Parameter Schema
# Simple JSON Schema without custom x-* extensions
# (Copick uses manual template rendering instead of schema-driven generation)
#
# Custom extensions:
#   x-compute-resource: Groups parameter in "Compute Resources" section - boolean
#   x-slurm-directive: SLURM directive flag (e.g., "--partition") - string

type: object

properties:
  # ============================================================================
  # Operation Mode Selection
  # ============================================================================
  operation:
    type: string
    title: Operation Mode
    description: Choose the operation to perform
    enum:
      - create
      - add_object
      - import_tomograms
    default: create
    x-bash-skip: true

  # ============================================================================
  # Copick Project Selection (for Add Object and Import operations)
  # ============================================================================
  copick_session:
    type: string
    title: Copick Session
    description: Select the Copick session to work with
    minLength: 1
    x-conditional: "operation == 'add_object' || operation == 'import_tomograms'"
    x-dynamic-options: true

  copick_run:
    type: string
    title: Copick Run
    description: Select the Copick run within the session
    minLength: 1
    x-conditional: "operation == 'add_object' || operation == 'import_tomograms'"
    x-dynamic-options:
      depends_on: copick_session

  # ============================================================================
  # Tomogram Import Parameters (for Create and Import operations)
  # ============================================================================
  import_tomo_type:
    type: string
    title: Tomogram Type
    description: Type of tomogram to import into Copick project
    enum:
      - dctf
      - sart
      - wbp
      - denoise
    default: dctf
    x-conditional: "operation == 'create' || operation == 'import_tomograms'"
    x-dynamic-options: true

  import_tomogram_run:
    type: string
    title: Tomogram Run Number
    description: Run number of tomograms to import (from AreTomo3 or DenoisET)
    minLength: 1
    x-conditional: "operation == 'create' || operation == 'import_tomograms'"
    x-dynamic-options: true

  downsample_voxel_size:
    type: number
    title: Downsample Voxel Size (Å)
    description: Target voxel size for downsampling. Leave empty to skip downsampling.
    minimum: 1.0
    maximum: 100.0
    default: 10.0
    x-conditional: "operation == 'create' || operation == 'import_tomograms'"

  # ============================================================================
  # Add Object Mode Parameters
  # ============================================================================

  object_name:
    type: string
    title: Object Name
    description: Name of the pickable object to add (e.g., 'ribosome', 'membrane')
    minLength: 1
    x-conditional-visibility:
      field: operation
      operator: eq
      value: add_object

  object_diameter:
    type: number
    title: Object Diameter (Å)
    description: Diameter of the object in Angstroms
    minimum: 1.0
    maximum: 1000.0
    x-conditional-visibility:
      field: operation
      operator: eq
      value: add_object

  template_map_name:
    type: string
    title: Template Map
    description: Select a template map from the database or provide custom map below
    x-conditional-visibility:
      field: operation
      operator: eq
      value: add_object
    x-dynamic-options: true

  pdb_id:
    type: string
    title: PDB ID (Optional)
    description: Protein Data Bank ID associated with this object (e.g., '4V6X')
    pattern: '^[0-9][A-Za-z0-9]{3}$'
    x-conditional-visibility:
      field: operation
      operator: eq
      value: add_object

  object_map_file:
    type: string
    title: Custom Object Map File (Optional)
    description: Path to custom MRC/MAP file. If provided, overrides template_map_name.
    x-conditional-visibility:
      field: operation
      operator: eq
      value: add_object

  object_voxel_size:
    type: number
    title: Object Map Voxel Size (Å)
    description: Voxel size of the custom object map (required if object_map_file is provided)
    minimum: 0.1
    maximum: 100.0
    x-conditional: "operation == 'add_object' && object_map_file"

  # SLURM Resource Options (Compute Resources section)
  slurm_partition:
    type: string
    title: 'Partition'
    description: SLURM partition to submit job to
    enum:
      - gpu
      - cpu
    default: gpu
    x-slurm-directive: '--partition'
    x-compute-resource: true

  slurm_gpus:
    type: integer
    title: 'Number of GPUs'
    description: GPUs to allocate (only for GPU partition)
    minimum: 1
    maximum: 8
    default: 1
    x-slurm-directive: '--gpus'
    x-compute-resource: true
    x-conditional: slurm_partition == 'gpu'

  slurm_nodes:
    type: integer
    title: 'Number of Nodes'
    description: Number of nodes to allocate
    minimum: 1
    maximum: 10
    default: 1
    x-slurm-directive: '-N'
    x-compute-resource: true

  slurm_cpus_per_task:
    type: integer
    title: 'CPUs per Task'
    description: Number of CPU cores per task
    minimum: 1
    maximum: 64
    default: 8
    x-slurm-directive: '--cpus-per-task'
    x-compute-resource: true

  slurm_mem_per_cpu:
    type: string
    title: 'Memory per CPU'
    description: Memory per CPU (e.g., 196G for large tomogram processing). Leave blank for SLURM default.
    default: ''
    pattern: '^([0-9]+[KMGT]){0,1}$'
    x-slurm-directive: '--mem-per-cpu'
    x-compute-resource: true

  slurm_time:
    type: string
    title: 'Time Limit'
    description: Maximum job runtime (HH:MM:SS format, e.g., 140:00:00)
    default: '140:00:00'
    pattern: '^[0-9]{1,3}:[0-5][0-9]:[0-5][0-9]$'
    x-slurm-directive: '--time'
    x-compute-resource: true

# Note: Required fields are enforced via minLength/minimum constraints
# and conditional validation in processor.py's validate_parameters() method
