name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which halves of the repo were touched. Pushes and manual runs check both.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ]; then
            echo "not a pull request - running everything"
            echo "backend=true"  >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          echo "changed files:"; echo "$changed" | sed 's/^/  /'

          match() { echo "$changed" | grep -qE "$1"; }

          # .github/workflows/ci* is in both lists so edits to CI itself get exercised.
          if match '^(umbrella/|pyproject\.toml|uv\.lock|infra/backend\.Dockerfile|\.github/workflows/ci)'; then
            echo "backend=true"  >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

          if match '^(frontend/|infra/frontend\.Dockerfile|\.github/workflows/ci)'; then
            echo "frontend=true"  >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/ci-backend.yaml

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/ci-frontend.yaml
