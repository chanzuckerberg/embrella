# tomogram file server (zarr, thumbnails, metrics CSVs) for the demo.
#
# The k8s twin of infra/compose.demo.yaml: a Caddy pod serves a local volume at
# /tomodata/ (same-origin, no CORS). The volume is a copy of the private S3
# bucket, pulled by an initContainer via the read-only IRSA role (sfbiohub-infra
# PR #66).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: embrella
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::911167894392:role/embrella-staging
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: embrella-tomodata
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: embrella-tomodata-caddyfile
data:
  Caddyfile: |
    # Ingress strips the /tomodata/ prefix, so files are served from /srv root.
    :80 {
    	root * /srv
    	file_server browse {
    		hide .DS_Store
    	}
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embrella-tomodata
  labels:
    app.kubernetes.io/name: embrella-tomodata
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO PVC: release before the next pod mounts it
  selector:
    matchLabels:
      app.kubernetes.io/name: embrella-tomodata
  template:
    metadata:
      labels:
        app.kubernetes.io/name: embrella-tomodata
    spec:
      serviceAccountName: embrella
      nodeSelector:
        kubernetes.io/arch: arm64
      initContainers:
        # Copy the bucket's tomodata/ prefix onto the PVC.
        - name: sync-tomodata
          image: public.ecr.aws/aws-cli/aws-cli:latest
          command: ["/bin/sh", "-c"]
          args:
            - aws s3 sync "s3://embrella-staging-demo/tomodata/" /srv --no-progress --delete
          env:
            - name: AWS_DEFAULT_REGION
              value: us-west-2
          volumeMounts:
            - name: tomodata
              mountPath: /srv
      containers:
        - name: caddy
          image: docker.io/library/caddy:2
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: tomodata
              mountPath: /srv
              readOnly: true
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tomodata
          persistentVolumeClaim:
            claimName: embrella-tomodata
        - name: caddyfile
          configMap:
            name: embrella-tomodata-caddyfile
---
apiVersion: v1
kind: Service
metadata:
  name: embrella-tomodata
spec:
  selector:
    app.kubernetes.io/name: embrella-tomodata
  ports:
    - name: http
      port: 80
      targetPort: 80
---
# Prefix-stripping ingress: /tomodata/<path> -> caddy /<path> (same-origin).
# Host is the stack ingress host; keep in sync if the stack is renamed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: embrella-tomodata
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  # Serve /tomodata on both the friendly public host and the argus-generated one.
  rules:
    - host: embrella.apps-staging.czbiohub.org
      http: &tomodata-http
        paths:
          - path: /tomodata(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: embrella-tomodata
                port:
                  number: 80
    - host: maximum-mastiff.staging-biohub.staging.czi.team
      http: *tomodata-http
