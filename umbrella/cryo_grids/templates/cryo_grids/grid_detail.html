<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grid Details</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
  <style>
    body {
      background-color: #f8f9fa;
      font-family: Arial, sans-serif;
    }
    .container {
      margin-top: 50px;
      max-width: 1000px;
      padding: 50px;
      background-color: #ffffff;
      box-shadow: 0px 0px 25px rgba(0,0,0,0.1);
      border-radius: 12px;
    }
    h2 {
      color: #007bff;
      font-size: 32px;
    }
    form {
      margin-top: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      font-weight: bold;
      color: #333;
    }
    select {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ced4da;
      font-size: 16px;
    }
    button, input[type="submit"] {
      width: 50%;
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      display: block;
      margin: 0 auto;
    }
    button:hover, input[type="submit"]:hover {
      background-color: #0056b3;
    }
    .warning {
      color: red;
      font-weight: bold;
      margin-top: 10px;
    }
    .go-back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 200px; /* 버튼 크기 조정 */
      height: 50px; /* 버튼 높이 조정 */
      background-color: #6c757d;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 14px; /* 글씨 크기 축소 */
      cursor: pointer;
    }
    .go-back-btn:hover {
      background-color: #5a6268;
    }
    .edit-button {
      width: 50%;
      padding: 10px;
      margin-top: 20px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      display: block;
      margin: 10px auto 0;
    }
    .edit-button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <button class="go-back-btn" onclick="window.location.href='/umbrella/'">Go back to the startup page</button>
  <div class="container">
    <h2 class="text-center"><u>Grid Details</u></h2>
    <div class="warning" id="warningMessage" style="display: true;">
      {{ error_msg }}
    </div>
    <br>
    <!- simple view of the metadata BEGIN -!>
    <table class="table table-hover table-bordered">
      <thead class="thead-dark">
        <tr>
          <th>Key</th>
          <th>Value</th>
        </tr>
      </thead>
      <tbody>
      {% for f, v in fields.items %}
        <tr>
          <td>{{ f }}</td>
          <td>{{ v }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
    <!- simple view of the metadata END -!>
  </div>

  <div class="container">
    <!- actions available -!>
    <form id="CopyGridToBoxForm" action="{% url 'cryo_grids:copy_grid_to_box' %}" method="post">
    {% csrf_token %}
      <div class="form-group">
        <label for="new_box">Box to put duplicated grid in</label>
        <select id="new_box" name="new_box" required>
        {% for option in form.grid_box.field.choices %}
          <option value="{{ option.0 }}" {% if option.0 == old_grid.grid_box.id %}selected{% endif %}>
            {{ option.1 }}
          </option>
        {% endfor %}
        </select>
      </div>
      <div class="form-group">
        {{ number_form }}
        <p> (<= available positions of the box chosen) </p>
        <input type="hidden" id="old_grid" name="old_grid" value={{ old_grid.id }}>
        <input type="submit" value="Duplicate this grid and save the new grids in box">
      </div>
    </form>
    <div class="form-group">
      <button class="edit-button" onclick='window.location.href="{% url 'admin:cryo_grids_cryogrid_change' old_grid.id %}"'>Edit this grid in admin interface</button>
    </div>
    <div class="warning" id="warningMessage" style="display: true;">
      {{ error_msg }}
    </div>
  </div>
</body>
</html>
