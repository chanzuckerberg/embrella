<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run Aretomo3 Job</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        .form-container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
        }
        #outputContainer {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
        .cancel-container {
            margin-top: 40px;
        }
        .cancel-container button {
            background-color: #f44336;
        }
        .cancel-container button:hover {
            background-color: #e53935;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Run Aretomo3 Job</h1>
        <form id="sessionForm">
            {% csrf_token %}
            <div class="form-group">
                <label for="sessionName">Session Name: (e.g., 24jul01a)</label>
                <input type="text" id="sessionName" name="sessionName" required>
            </div>
            <div class="form-group">
                <label for="runNumber">Run Number: (e.g., 001)</label>
                <input type="number" id="runNumber" name="runNumber" required>
            </div>
            <div class="form-group">
                <label for="pixelSize">Pixel Size:</label>
                <input type="number" step="any" id="pixelSize" name="pixelSize" required>
            </div>
            <div class="form-group">
                <label for="numChecks">Number of Checks:</label>
                <input type="number" id="numChecks" name="numChecks" required>
            </div>
            <div class="form-group">
                <label for="userId">User ID: (e.g., firstname.lastname)</label>
                <input type="text" id="userId" name="userId">
            </div>
            <div class="form-group">
                <label for="seconds">Seconds:</label>
                <input type="number" step="any" id="seconds" name="seconds" value="180" required>
            </div>
            <button type="button" onclick="runFunction()">Run</button>
        </form>
        <div id="outputContainer">
            <strong>Output Directory:</strong> <span id="outputDirectory"></span>
        </div>
    </div>

    <div class="form-container cancel-container">
        <h1>Cancel Aretomo3 Job</h1>
        <form id="cancelForm">
            <div class="form-group">
                <label for="jobNumber">Job Number:</label>
                <input type="number" id="jobNumber" name="jobNumber" required>
            </div>
            <button type="button" onclick="confirmCancel()">Cancel</button>
        </form>
    </div>

    <script>
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        async function fetchUserInfo() {
            const response = await fetch('/workflow/user_info');
            const result = await response.json();

            if (response.ok) {
                document.getElementById('userId').value = result.username;
            } else {
                alert('Failed to fetch user info');
            }
        }

        async function runFunction() {
            const sessionName = document.getElementById('sessionName').value;
            const runNumber = document.getElementById('runNumber').value;
            const pixelSize = document.getElementById('pixelSize').value;
            const numChecks = document.getElementById('numChecks').value;
            const userId = document.getElementById('userId').value;
            const seconds = document.getElementById('seconds').value;

            const csrftoken = getCookie('csrftoken');

            const response = await fetch('/workflow/run_aretomo3', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                body: JSON.stringify({
                    session_name: sessionName,
                    run_number: runNumber,
                    pixel_size: pixelSize,
                    num_checks: numChecks,
                    user_id: userId,
                    seconds: seconds
                })
            });

            const result = await response.json();

            if (response.ok) {
                alert(`Output: ${result.output}\nError: ${result.error}`);
                document.getElementById('outputDirectory').textContent = `/hpc/projects/group.czii/krios1.processing/aretomo3/${sessionName}`;
                document.getElementById('outputContainer').style.display = 'block';
            } else {
                alert(`Failed to run the job. Error: ${result.error}`);
            }
        }

        function confirmCancel() {
            const ignorePrompt = getCookie('ignoreCancelPrompt');
            if (ignorePrompt === 'true') {
                cancelFunction();
            } else {
                const confirmCancel = confirm("Are you sure you want to cancel?");
                if (confirmCancel) {
                    const ignoreFuturePrompts = confirm("Do you want to ignore this prompt for the next 24 hours?");
                    if (ignoreFuturePrompts) {
                        setCookie('ignoreCancelPrompt', 'true', 1);
                    }
                    cancelFunction();
                }
            }
        }

        function setCookie(name, value, days) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + date.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        async function cancelFunction() {
            const jobNumber = document.getElementById('jobNumber').value;

            const csrftoken = getCookie('csrftoken');

            const response = await fetch('/workflow/cancel_aretomo3', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                body: JSON.stringify({
                    job_number: jobNumber
                })
            });

            const result = await response.json();

            if (response.ok) {
                alert(`Job ${jobNumber} has been canceled.`);
            } else {
                alert(`Failed to cancel the job. Error: ${result.error}`);
            }
        }

        document.addEventListener('DOMContentLoaded', (event) => {
            fetchUserInfo();
        });
    </script>
</body>
</html>
