# Staging overlay. Combine with compose.yaml.
#
# Before first run on a fresh host:
#   podman network create embrella
#   # Obtain the SLURM SSH key from an admin (vault) and place it on the host,
#   # then point .env.staging's SLURM_KEYFILE at that host path.
#   # Create the image upload dir and set .env.staging's EMBRELLA_MEDIA_HOST_DIR to it,
#   # e.g. mkdir -p /srv/embrella-media. Back it up with `just mediabackupv2 staging`.
#
# Then (--env-file so ${VAR} interpolation resolves; deployv2 copies the chosen
# env file to .env.staging on the host):
#   podman compose --env-file .env.staging -f infra/compose.yaml -f infra/compose.staging.yaml pull
#   podman compose --env-file .env.staging -f infra/compose.yaml -f infra/compose.staging.yaml up -d
#
# Or: `just deployv2 staging .env.staging <branch> <tag>`.
#
# `just loadcontainerdb` is for loading real data (DR / seeding / rollback),
# backup with `just dbbackupv2 staging`.
#
# NOTE: `user: "0:0"` on the app services. These hosts run rootless podman on the
# native kernel overlay driver, which cannot exec/chown as a non-root

services:
  migrate:
    user: '0:0'
    env_file:
      - ../${EMBRELLA_ENV_FILE:-.env.staging}
    environment:
      DJANGO_ENV: staging

  backend:
    user: '0:0'
    env_file:
      - ../${EMBRELLA_ENV_FILE:-.env.staging}
    environment:
      DJANGO_ENV: staging
      SLURM_KEYFILE: /run/secrets/slurm_key
      # nginx streams uploaded files once Django has checked the request
      MEDIA_ACCEL_PREFIX: /protected-media/
    volumes:
      - ${SLURM_KEYFILE:-/dev/null}:/run/secrets/slurm_key:ro
      - ${EMBRELLA_MEDIA_HOST_DIR:?set EMBRELLA_MEDIA_HOST_DIR}:/srv/media:z

  worker:
    user: '0:0'
    env_file:
      - ../${EMBRELLA_ENV_FILE:-.env.staging}
    environment:
      DJANGO_ENV: staging
      SLURM_KEYFILE: /run/secrets/slurm_key
      DEPOSITION_INGESTION_GITHUB_KEY_PATH: /run/secrets/ingestion_github_key
    volumes:
      - ${SLURM_KEYFILE:-/dev/null}:/run/secrets/slurm_key:ro
      - ${DEPOSITION_INGESTION_GITHUB_KEY_HOSTPATH:-/dev/null}:/run/secrets/ingestion_github_key:ro

  db:
    # Derived image patches out the entrypoint's gosu drop to UID 999, and
    # `--user=root` lets mariadbd run as the container's UID 0 — both required
    # because rootless podman on the native overlay driver can't exec as a
    # non-root in-container UID. See infra/db.Dockerfile.
    image: ${IMAGE_REGISTRY:-embrella}/db:${IMAGE_TAG:-latest}
    user: '0:0'
    command: ['mariadbd', '--user=root']
    ports:
      - '127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306'
    environment:
      MARIADB_USER: ${MYSQL_USER:?set MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PWD:?set MYSQL_PWD}

  frontend:
    user: '0:0'
    environment:
      NODE_ENV: production

  nginx:
    ports:
      - '${NGINX_HOST_PORT:-80}:80'
    volumes:
      - ./nginx_staging.conf.template:/etc/nginx/templates/nginx.conf.template:ro,z
      - ${EMBRELLA_MEDIA_HOST_DIR:?set EMBRELLA_MEDIA_HOST_DIR}:/srv/media:ro,z
