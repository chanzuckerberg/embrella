<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aretomo3 Metadata Fetcher</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            position: relative;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-top: 10px;
            color: #555;
        }
        input[type="text"] {
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            margin-top: 20px;
            padding: 10px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .copy-button {
            background-color: #E0E0E0;
            border: none;
            border-radius: 4px;
            color: #4A4A4A;
            cursor: pointer;
            font-size: 14px;
            padding: 6px 12px;
            transition: background-color 0.3s;
            position: absolute;
            top: 5px;
            right: 5px;
        }
        .copy-button:hover {
            background-color: #C0C0C0;
        }
        .copy-button:active {
            background-color: #A0A0A0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid #ccc;
        }
        th, td {
            padding: 10px;
            text-align: center;
            vertical-align: middle;
        }
        th {
            background-color: #f4f4f9;
        }
        .go-back {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .go-back:hover {
            background-color: #1e88e5;
        }
    </style>
    <script>
        async function fetchMetadata() {
            const session = document.getElementById('session').value;
            const runId = document.getElementById('run_id').value;
            const endpoint = `/workflow/get_aretomo3?session=${session}&run_id=${runId}`;

            try {
                const response = await fetch(endpoint);
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || 'Network response was not ok');
                }
                displayResultAsTable(data);
            } catch (error) {
                document.getElementById('result').innerHTML = `Error: ${error.message}`;
            }
        }

        function displayResultAsTable(data) {
            const resultContainer = document.getElementById('result');
            resultContainer.innerHTML = '';

            const table = document.createElement('table');

            Object.keys(data).forEach(key => {
                const row = document.createElement('tr');
                const cellKey = document.createElement('td');
                const cellValue = document.createElement('td');

                cellKey.textContent = key;
                cellValue.textContent = Array.isArray(data[key]) ? data[key].join(', ') : data[key];

                row.appendChild(cellKey);
                row.appendChild(cellValue);
                table.appendChild(row);
            });

            resultContainer.appendChild(table);
        }

        function copyToClipboard() {
            const resultText = document.getElementById('result').innerText;
            navigator.clipboard.writeText(resultText).then(() => {
                alert('Result copied to clipboard');
            }).catch(err => {
                alert('Failed to copy: ', err);
            });
        }

        function goBack() {
            window.location.href = '/umbrella';
        }
    </script>
</head>
<body>
    <button class="go-back" onclick="goBack()">Go Back</button>
    <div class="container">
        <h1>Aretomo3 Metadata Fetcher</h1>
        <form id="metadataForm" onsubmit="event.preventDefault(); fetchMetadata();">
            <label for="session">Session:</label>
            <input type="text" id="session" name="session" required>

            <label for="run_id">Run ID:</label>
            <input type="text" id="run_id" name="run_id" required>

            <button type="submit">Fetch Metadata</button>
        </form>
        <h2>Result:</h2>
        <div class="result-container">
            <div id="result"></div>
            <button class="copy-button" onclick="copyToClipboard()">Copy</button>
        </div>
    </div>
</body>
</html>
