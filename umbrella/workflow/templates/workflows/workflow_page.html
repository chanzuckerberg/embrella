<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aretomo3 Metadata Fetcher</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-top: 10px;
            color: #555;
        }
        input[type="text"] {
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            margin-top: 20px;
            padding: 10px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        pre {
            background-color: #f0f0f0;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            white-space: pre-wrap;
        }
    </style>
    <script>
        async function fetchMetadata() {
            const session = document.getElementById('session').value;
            const runId = document.getElementById('run_id').value;
            const volId = document.getElementById('vol_id').value;
            const endpoint = `/workflow/get_aretomo3?session=${session}&run_id=${runId}${volId ? `&vol_id=${volId}` : ''}`;

            try {
                const response = await fetch(endpoint);
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const data = await response.json();
                document.getElementById('result').textContent = JSON.stringify(data, null, 4);
            } catch (error) {
                document.getElementById('result').textContent = `Error: ${error.message}`;
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>Aretomo3 Metadata Fetcher</h1>
        <form id="metadataForm" onsubmit="event.preventDefault(); fetchMetadata();">
            <label for="session">Session:</label>
            <input type="text" id="session" name="session" required>

            <label for="run_id">Run ID:</label>
            <input type="text" id="run_id" name="run_id" required>

            <label for="vol_id">Volume ID (optional):</label>
            <input type="text" id="vol_id" name="vol_id">

            <button type="submit">Fetch Metadata</button>
        </form>
        <h2>Result:</h2>
        <pre id="result"></pre>
    </div>
</body>
</html>
